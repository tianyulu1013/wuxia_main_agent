<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>五行卡牌后台管理编辑器</title>
    <link rel="stylesheet" href="/editor.css?v=20260725_02" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">编</div>
          <div>
            <h1>卡牌与规则后台</h1>
            <p class="site-version">暂存草稿控制台</p>
          </div>
        </div>

        <!-- 导航 Tabs -->
        <div class="sidebar-tabs">
          <button id="tabCard" class="tab-button active" onclick="switchTab('card')">🔍 卡牌暂存</button>
          <button id="tabDocs" class="tab-button" onclick="switchTab('docs')">📚 规则暂存</button>
        </div>

        <!-- ① 卡牌侧边栏面板 -->
        <div id="cardSidebar" class="sidebar-panel">
          <div class="search-box">
            <div class="search-row-first">
              <select id="searchCategory" onchange="filterCards()">
                <option value="all">所有分类</option>
                <option value="combat_characters">战斗人物</option>
                <option value="attached_characters">附加人物</option>
                <option value="items">神兵/物品</option>
                <option value="scenes">场景</option>
                <option value="titles">身份/称号</option>
                <option value="deprecated">废弃</option>
              </select>
              <button class="btn-new-small" onclick="createNewCard()" title="新建一张卡牌">➕ 新建</button>
            </div>
            <input id="searchQ" type="search" placeholder="输入名称搜索卡牌..." oninput="filterCards()" autocomplete="off" />
            
            <div class="filter-options-row">
              <label class="checkbox-label-small">
                <input type="checkbox" id="filterStagedOnly" onchange="filterCards()" />
                <span>仅看已暂存草稿 (<span id="stagedCount">0</span>)</span>
              </label>
            </div>
          </div>
          <div id="cardList" class="list-container">
            <div class="loading">读取卡牌中...</div>
          </div>
        </div>

        <!-- ② 规则文献侧边栏面板 -->
        <div id="docsSidebar" class="sidebar-panel hidden">
          <div id="docsList" class="list-container">
            <div class="loading">读取文献中...</div>
          </div>
        </div>
      </aside>

      <main class="editor-workspace">
        <!-- 提示消息栏 -->
        <div id="notifyBar" class="notify-bar hidden"></div>

        <!-- ① 卡牌编辑器主体 -->
        <section id="cardEditorPanel" class="editor-panel">
          <div id="cardEditorEmpty" class="editor-empty">请从左侧选择卡牌或新建卡牌开始编辑</div>
          <form id="cardForm" class="editor-form hidden" onsubmit="saveCard(event)">
            <input type="hidden" id="cardId" />
            <input type="hidden" id="originalCategory" />
            
            <div class="form-header">
              <div>
                <h2 id="cardFormTitle">编辑卡牌</h2>
                <p class="form-subtitle">注意：保存仅写入“暂存候选层”，不会直接动用源数据库文件。</p>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn-save">💾 暂存修改</button>
                <button type="button" class="btn-cancel" onclick="cancelCardEdit()">取消</button>
              </div>
            </div>

            <div class="form-grid">
              <label class="field">
                <span>类别 (分类归属)</span>
                <select id="cardCategory" required>
                  <option value="combat_characters">战斗人物</option>
                  <option value="attached_characters">附加人物</option>
                  <option value="items">物品/神兵</option>
                  <option value="scenes">场景</option>
                  <option value="titles">身份/称号</option>
                  <option value="deprecated">废弃</option>
                </select>
              </label>

              <label class="field">
                <span>卡牌名称</span>
                <input type="text" id="cardTitle" required autocomplete="off" />
              </label>

              <label class="field char-only">
                <span>生命值 (Life)</span>
                <input type="text" id="cardLife" autocomplete="off" />
              </label>



              <label class="field char-only">
                <span>性别 (Gender)</span>
                <select id="cardGender">
                  <option value="男">男</option>
                  <option value="女">女</option>
                  <option value="无">无</option>
                </select>
              </label>

              <label class="field char-only">
                <span>兵器 (Weapons)</span>
                <input type="text" id="cardWeapons" placeholder="例如：【剑】" autocomplete="off" />
              </label>

              <label class="field item-only">
                <span>物品类别 (item_category)</span>
                <input type="text" id="cardItemCategory" placeholder="例如：武器" autocomplete="off" />
              </label>

              <label class="field item-only">
                <span>特性 (traits)</span>
                <input type="text" id="cardTraits" placeholder="例如：神兵" autocomplete="off" />
              </label>

              <label class="field">
                <span>出处 (Source Work)</span>
                <input type="text" id="cardSourceWork" autocomplete="off" />
              </label>

              <label class="field">
                <span>作者 (Author)</span>
                <input type="text" id="cardAuthorGroup" autocomplete="off" />
              </label>
              
              <label class="field">
                <span>修改理由 / 设计目标 (Design Goal)</span>
                <input type="text" id="cardDesignGoal" placeholder="为什么修改这张卡？如：削弱爆发、加强生存" autocomplete="off" />
              </label>
            </div>

            <div class="form-section char-only">
              <h3>身份信息 / 规则条件 (Identity)</h3>
              <textarea id="cardIdentity" rows="5" placeholder="身份规则描述..."></textarea>
            </div>

            <div class="form-section">
              <div class="section-title-row">
                <h3>结构化特技数据 (Abilities)</h3>
                <button type="button" class="btn-add-ability" onclick="addAbility()">➕ 添加特技</button>
              </div>
              <div id="abilitiesList" class="abilities-list">
                <!-- 动态渲染特技列表 -->
              </div>
            </div>

            <div class="form-section">
              <h3>人物关系 / 额外描述 (Relationships)</h3>
              <textarea id="cardRelationships" rows="3" placeholder="人物关系描述..."></textarea>
            </div>

            <div class="form-section">
              <h3>原始卡面文本描述 (Concatenated Description)</h3>
              <textarea id="cardDescription" rows="6" required placeholder="招式：...&#10;技能：..."></textarea>
            </div>
          </form>
        </section>

        <!-- ② 规则文献编辑器主体 -->
        <section id="docsEditorPanel" class="editor-panel hidden">
          <div id="docsEditorEmpty" class="editor-empty">请从左侧选择文献开始编辑</div>
          <form id="docsForm" class="editor-form hidden" onsubmit="saveDocument(event)">
            <input type="hidden" id="docId" />
            
            <div class="form-header">
              <div>
                <h2 id="docFormTitle">编辑文献</h2>
                <p class="form-subtitle">注意：保存仅写入“暂存候选层”，不会直接覆盖源规则文件。</p>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn-save">💾 暂存修改</button>
                <button type="button" class="btn-cancel" onclick="cancelDocEdit()">取消</button>
              </div>
            </div>

            <div class="form-section full-height-section">
              <h3>正文内容 (支持 Markdown 格式)</h3>
              <textarea id="docContent" class="doc-content-textarea" placeholder="在此输入文献正文内容..."></textarea>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="/glossary.js?v=20260725_01"></script>
    <script src="/editor.js?v=20260725_02"></script>
  </body>
</html>
